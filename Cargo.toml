[package]
name = "ifscan"
version = "0.1.0"
edition = "2021"
description = "Inspect QNX image filesystems (IFS) on any host and produce a software bill of materials"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
object = { version = "0.36", default-features = false, features = ["read", "elf", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
memchr = "2"
flate2 = "1.1.11"
lz4_flex = "0.14.0"
lzokay-native = "0.2.1"
ureq = { version = "2", features = ["json"] }
